name: Release Step 2 - Publish to PyPI
run-name: publish to pypi

on:
  workflow_run:
    workflows: ["Release Step 1 - Release on GitHub"] # Must match name exactly
    types: [completed]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or tag to publish'
        default: 'main'
        required: false

jobs:
  pypi-publish:
    # Only run if Step 1 was successful, or if triggered manually
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    name: Build and publish Python package
    runs-on: ubuntu-latest
    environment: release

    permissions:
      id-token: write # Required for PyPI Trusted Publishing
      contents: read

    steps:
      - name: Resolve publish ref
        id: publish_ref
        env:
          EVENT_NAME: ${{ github.event_name }}
          UPSTREAM_EVENT: ${{ github.event.workflow_run.event }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          INPUT_REF: ${{ inputs.ref }}
        run: |
          # Step 1 started by workflow_dispatch publishes head_branch (usually main).
          # A release/* tag push reports that tag as head_branch, which is the
          # pre-bump commit. Publish the version tag Step 1 created instead.
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            ref="${INPUT_REF:-main}"
          elif [ "$UPSTREAM_EVENT" = "push" ]; then
            case "$HEAD_BRANCH" in
              release/*) ref="${HEAD_BRANCH#release/}" ;;
              *) ref="${HEAD_BRANCH:-main}" ;;
            esac
          elif [ -n "$HEAD_BRANCH" ]; then
            ref="$HEAD_BRANCH"
          else
            ref="${INPUT_REF:-main}"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.publish_ref.outputs.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"

      - name: Build package
        run: uv build

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          print-hash: true
