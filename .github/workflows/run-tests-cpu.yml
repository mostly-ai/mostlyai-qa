name: '[CPU] mostlyai-qa Tests'

on:
  workflow_call:

env:
  PYTHON_KEYRING_BACKEND: keyring.backends.null.Keyring
  FORCE_COLOR: '1'

jobs:
  run-tests-cpu:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Setup | Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup | Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Setup | uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.12.23'
          enable-cache: false
          python-version: '3.11'

      - name: Setup | dependencies
        run: |
          uv sync --frozen --only-group dev --only-group docs
          uv export --frozen --no-dev --no-default-groups --no-emit-project --no-hashes --no-emit-package torch --output-file /tmp/runtime-constraints.txt
          uv pip install --constraint /tmp/runtime-constraints.txt --index-strategy unsafe-first-match torch==2.14.1+cpu . --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Type check (ty)
        run: uv run --no-sync ty check

      - name: Run tests
        run: uv run --no-sync pytest tests/

      - name: Build mkdocs
        run: uv run --no-sync mkdocs build --strict
